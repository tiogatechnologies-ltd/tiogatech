  [functions.auto-charge-due]
    verify_jwt = false
  [functions.finance-reminders]
    verify_jwt = false
  [functions.check-overdue-and-deadlines]
    verify_jwt = false
  [functions.reset-monthly-free-credits]
    verify_jwt = false
  [functions.backup-to-drive]
    verify_jwt = true
  [functions.generate-payment-link]
    verify_jwt = true
  [functions.handle-email-suppression]
    verify_jwt = false
  [functions.handle-email-unsubscribe]
    verify_jwt = false
  [functions.paystack-init]
    verify_jwt = false
  [functions.paystack-verify]
    verify_jwt = false
  [functions.paystack-webhook]
    verify_jwt = false
  [functions.preview-transactional-email]
    verify_jwt = false
  # Authenticates itself: a service-role JWT, or CRON_SHARED_SECRET from the
  # scheduler. Gateway JWT is off so pg_cron need not hold a Supabase key.
  [functions.process-email-queue]
    verify_jwt = false
  [functions.send-transactional-email]
    verify_jwt = true
  [functions.sizing-report]
    verify_jwt = false
  # Guests can check a coupon before signing in; the function only reads
  # discount rules and never exposes a secret.
  [functions.validate-discount]
    verify_jwt = false
  [functions.track-order]
    verify_jwt = false
